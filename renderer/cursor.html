<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:;">
  <title>Aero Cursor Overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      pointer-events: none;
      user-select: none;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    #cursorCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    /* Badge keterangan aksi yang melayang di dekat kursor */
    #actionBadge {
      position: absolute;
      display: none;
      pointer-events: none;
      transform: translate(-50%, -140%);
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 600;
      color: #2b1a14;
      background: #f1bd57;
      border: 2px solid #3a1410;
      box-shadow: 2px 2px 0 #3a1410;
      image-rendering: pixelated;
      white-space: nowrap;
      z-index: 100;
      animation: badgePop 0.15s steps(2) both;
    }
    @keyframes badgePop {
      from { transform: translate(-50%, -100%) scale(0.7); opacity: 0; }
      to { transform: translate(-50%, -140%) scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <canvas id="cursorCanvas"></canvas>
  <div id="actionBadge"></div>
  <script src="pixel-cursor.js"></script>
</body>
</html>
